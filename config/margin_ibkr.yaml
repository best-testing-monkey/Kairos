base_currency: EUR
benchmark_annual_pct: 3.15          # configurable; verify current EUR benchmark
negative_balance_protection: true
closeout_fraction: 0.5              # ESMA: liquidate at 50% of initial margin
# initial_margin_pct values below marked "measured 2026-09-02" come from
# live ib_async whatIfOrder() calls against a real IB Gateway paper account
# (base currency EUR, NetLiq ~EUR1M), found via kairos-07's cost/financing
# probe. maintenance_margin_pct keeps this file's existing initial/2
# convention (no maintenance-side whatIf data was collected) -- rescale it
# if real maintenance figures ever get measured.
#
# ACCOUNT CONSTRAINT -- PRIIPs/KID (kairos-07, full 153-symbol universe
# sweep, 2026-09-02): 26 of CANDIDATE_UNIVERSE's 27 ETFs cannot be held on
# this account -- IB error 201, "No Trading Permission, Customer
# Ineligible ... does not have a KID in English or in a language approved
# for your country" (EU retail PRIIPs/KID regime). This is PER-PRODUCT, not
# per-domicile/asset-class: DIA is the same US-listed/ARCA/USD ETF type as
# SPY, but DIA trades fine (10.36% initial margin, confirmed) while SPY is
# blocked -- never infer availability from domicile, check per symbol.
# Confirmed BLOCKED: COPX, CPER, DBC, GDX, GLD, HYG, IWM, PDBC, QQQ, REMX,
# SLV, SPY, TLT, UNG, USO, XLB, XLC, XLE, XLF, XLI, XLK, XLP, XLRE, XLU,
# XLV, XLY. Confirmed TRADEABLE: DIA. (TLT/HYG are bond ETFs with no
# dedicated bucket below -- they fall to equity_cfd's catch-all, also
# blocked.) This is a trading-permission gap, not a margin-math one -- the
# rates below aren't wrong, some of the symbols they're attached to may
# simply be unorderable here.
classes:
  fx_major:
    symbols: ["EURUSD=X", "USDJPY=X", "GBPUSD=X", "AUDUSD=X", "USDCAD=X", "NZDUSD=X", "USDCHF=X"]
    initial_margin_pct: 2.88        # measured 2026-09-02: EUR.USD CFD initMarginChange=2.88% (was 3.33 estimate)
    maintenance_margin_pct: 1.44
    financing_spread_pct: 1.5
  fx_minor:
    match: "=X$"                    # regex fallback for any other FX pair
    initial_margin_pct: 5.0
    maintenance_margin_pct: 2.5
    financing_spread_pct: 1.5
  index_gold_major:
    symbols: ["GC=F", "^GSPC", "^IXIC", "^DJI", "SPY", "QQQ"]
    # measured 2026-09-02: IBUS500 (index CFD) 7.29%, XAUUSD (gold CFD) 8.78%,
    # GC=F future 8.85% (close to the CFD figure, though futures aren't
    # margined like CFDs) -- this bucket lumps index and gold together but
    # they measure differently; using the higher (gold) figure for both
    # rather than splitting the class. Revisit if index vs. gold margin
    # needs to be distinguished. SPY and QQQ, named above, are both
    # PRIIPs/KID-blocked on this account -- see the top-of-file note.
    initial_margin_pct: 8.78        # was 5.0 estimate
    maintenance_margin_pct: 4.39
    financing_spread_pct: 1.5
  commodity_other:
    match: "=F$"                    # other futures proxies after index_gold_major
    # All ten of this bucket's ETF proxies (GLD/SLV/USO/UNG/DBC/PDBC/CPER/
    # COPX/REMX/GDX) are confirmed PRIIPs/KID-blocked -- see the top-of-file
    # note -- so this class currently describes nothing this account can
    # trade via ETF. Real commodity exposure would need futures instead,
    # which margin very differently per-commodity (kairos-07 measured
    # roughly a 6%-17% range across gold/oil/nat-gas/grains/metals,
    # 2026-09-02) -- too wide for one flat rate. Not filling in a specific
    # futures figure yet: the grain contracts' measured values had a
    # priceMagnifier bug (pending re-sweep), and this account has no
    # dedicated commodities segment, so even the clean figures (gold/oil/
    # nat-gas) aren't confirmed actually tradeable here, only what IBKR
    # would charge if they were. Left at the unverified 10% estimate
    # pending a settled, confirmed-tradeable number.
    initial_margin_pct: 10.0        # unverified estimate
    maintenance_margin_pct: 5.0
    financing_spread_pct: 1.5
  crypto_cfd:
    enabled: false                  # IBKR EU retail availability uncertain; off by default
    initial_margin_pct: 50.0
    maintenance_margin_pct: 25.0
    financing_spread_pct: 2.5
  crypto_spot:
    match: "-USD$"
    initial_margin_pct: 100.0       # unleveraged: full notional locked
    maintenance_margin_pct: 0.0
    financing_spread_pct: 0.0
  equity_cfd:
    match: null                     # default for anything unmatched (plain tickers)
    # measured 2026-09-02: AAPL CFD initMarginChange=28.49% long / 30.71%
    # short (this schema has no long/short split -- using the more
    # conservative short figure). Also: AAPL cash stock measured at 28.50%,
    # essentially identical to the CFD figure -- US stock CFDs are NOT
    # leveraged relative to cash stock on this account, despite the name.
    initial_margin_pct: 30.71       # was 20.0 estimate -- previously under-margined by ~10pp
    maintenance_margin_pct: 15.36
    financing_spread_pct: 1.5
    # Confirmed representative (kairos-07, 2026-09-02, 40 US stocks swept):
    # 28.24%-30.78% long, ~30.69% short average -- 30.71% holds.
    # Also: ETFs get materially better margin than single stocks on this
    # account (DIA 10.36% vs AAPL 28.52%) -- this one rate covers both
    # populations (though DIA is the only ETF actually tradeable here, see
    # the top-of-file PRIIPs/KID note). Not changed; worth a per-class
    # split later if it matters.
# Per-symbol house-margin overrides example:
# "LDO-USD": {initial_margin_pct: 100.0}
overrides: {}
short_borrow_annual_pct:
  default: 1.0                      # placeholder; real borrow fees are per-name
  overrides: {}
