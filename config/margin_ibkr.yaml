base_currency: EUR
benchmark_annual_pct: 3.15          # configurable; verify current EUR benchmark
negative_balance_protection: true
closeout_fraction: 0.5              # ESMA: liquidate at 50% of initial margin
# initial_margin_pct values below marked "measured 2026-09-02" come from
# live ib_async whatIfOrder() calls against a real IB Gateway paper account
# (base currency EUR, NetLiq ~EUR1M), found via kairos-07's cost/financing
# probe (scripts/ibkr_instruments.py / data/ibkr_instruments.db --
# `--report` re-derives all of this from the raw sweep data). Figures below
# are the FINAL, currency-corrected set: an earlier pass divided
# IBKR's EUR-base-currency initMarginChange by a notional computed in the
# CONTRACT's currency, understating every USD-denominated instrument by
# ~1.16x (EUR-denominated ones, e.g. IBDE40, were unaffected and unchanged
# across both passes). Every row now carries an auditable fx_rate_to_base;
# `--report` warns on any row missing one. maintenance_margin_pct keeps
# this file's existing initial/2 convention (no maintenance-side whatIf
# data was collected) -- rescale it if real maintenance figures ever get
# measured.
#
# ACCOUNT CONSTRAINT -- PRIIPs/KID (kairos-07, full 153-symbol universe
# sweep, 2026-09-02): 26 of CANDIDATE_UNIVERSE's 27 ETFs cannot be held on
# this account -- IB error 201, "No Trading Permission, Customer
# Ineligible ... does not have a KID in English or in a language approved
# for your country" (EU retail PRIIPs/KID regime). This is PER-PRODUCT, not
# per-domicile/asset-class: DIA is the same US-listed/ARCA/USD ETF type as
# SPY, but DIA trades fine (10.36% initial margin, confirmed) while SPY is
# blocked -- never infer availability from domicile, check per symbol.
# Confirmed BLOCKED: COPX, CPER, DBC, GDX, GLD, HYG, IWM, PDBC, QQQ, REMX,
# SLV, SPY, TLT, UNG, USO, XLB, XLC, XLE, XLF, XLI, XLK, XLP, XLRE, XLU,
# XLV, XLY. Confirmed TRADEABLE: DIA. (TLT/HYG are bond ETFs with no
# dedicated bucket below -- they fall to equity_cfd's catch-all, also
# blocked.) This is a trading-permission gap, not a margin-math one -- the
# rates below aren't wrong, some of the symbols they're attached to may
# simply be unorderable here.
classes:
  fx_major:
    symbols: ["EURUSD=X", "USDJPY=X", "GBPUSD=X", "AUDUSD=X", "USDCAD=X", "NZDUSD=X", "USDCHF=X"]
    # measured 2026-09-02 (currency-corrected): EUR.USD 3.32%, USD/JPY
    # 3.31%, GBP.USD 3.74%, AUD.USD 5.00% (the outlier -- see override
    # below). 3.32 taken as the class rate; AUDUSD=X overridden separately
    # rather than dragging the whole class up to the outlier.
    initial_margin_pct: 3.32
    maintenance_margin_pct: 1.66
    financing_spread_pct: 1.5
  fx_minor:
    match: "=X$"                    # regex fallback for any other FX pair
    initial_margin_pct: 5.0
    maintenance_margin_pct: 2.5
    financing_spread_pct: 1.5
  index_gold_major:
    symbols: ["GC=F", "^GSPC", "^IXIC", "^DJI", "SPY", "QQQ"]
    # measured 2026-09-02 (currency-corrected), two sub-populations:
    # index CFDs 6.68-10.82% (IBUS500/^GSPC proxy 8.48%, IBUST100/^IXIC
    # proxy 10.82%; IBGB100 6.68% and IBDE40 9.34% aren't this bucket's own
    # symbols); gold 10.29% (XAUUSD CFD) / 10.68% (CMDTY spot), GC=F itself
    # untested for CFD-equivalent margin. This bucket lumps index and gold
    # together but they measure differently; using the highest of the
    # relevant figures (10.82, IBUST100) for both rather than splitting the
    # class -- the data now supports a split if it's ever worth doing. SPY
    # and QQQ, named above, are both PRIIPs/KID-blocked on this account --
    # see the top-of-file note.
    initial_margin_pct: 10.82
    maintenance_margin_pct: 5.41
    financing_spread_pct: 1.5
  commodity_other:
    match: "=F$"                    # other futures proxies after index_gold_major
    # All ten of this bucket's ETF proxies (GLD/SLV/USO/UNG/DBC/PDBC/CPER/
    # COPX/REMX/GDX) are confirmed PRIIPs/KID-blocked -- see the top-of-file
    # note -- so this class currently describes nothing this account can
    # trade via ETF. Real commodity exposure would need futures instead,
    # measured 2026-09-02 (final, currency-corrected): ZS=F 7.24%, ZC=F
    # 7.59%, GC=F 10.24%, NG=F 13.70%, CL=F 17.97%, SI=F 19.20% -- a 7-19%
    # spread, no single rate covers it (kairos-07's recommendation: leave
    # the placeholder rather than fit one number). Separately, this account
    # has no dedicated commodities segment, so even these figures are
    # cost-if-permitted, not proof any of them are actually tradeable here.
    # Left at the unverified 10% estimate.
    initial_margin_pct: 10.0        # unverified estimate
    maintenance_margin_pct: 5.0
    financing_spread_pct: 1.5
  crypto_cfd:
    enabled: false                  # IBKR EU retail availability uncertain; off by default
    initial_margin_pct: 50.0
    maintenance_margin_pct: 25.0
    financing_spread_pct: 2.5
  crypto_spot:
    match: "-USD$"
    initial_margin_pct: 100.0       # unleveraged: full notional locked
    maintenance_margin_pct: 0.0
    financing_spread_pct: 0.0
  equity_cfd:
    match: null                     # default for anything unmatched (plain tickers)
    # measured 2026-09-02, FINAL currency-corrected figure (see top-of-file
    # note -- an earlier uncorrected pass read 30.71%, understated by the
    # EUR/USD conversion bug): 40 US stocks swept, long 32.82%-35.70%
    # (mean 33.11%), short mean 35.61% -- using short, the more
    # conservative side (this schema has no long/short split). Commission
    # measured flat at $1.00 regardless of size (no marginal per-notional
    # component). Also: ETFs get materially better margin than single
    # stocks on this account (DIA 12.01% vs this bucket's 35.61%) -- this
    # one rate covers both populations (though DIA is the only ETF
    # actually tradeable here, see the top-of-file PRIIPs/KID note). Not
    # split; worth doing later if it matters.
    initial_margin_pct: 35.61       # was 20.0 estimate, then 30.71 uncorrected -- see comment above
    maintenance_margin_pct: 17.81
    financing_spread_pct: 1.5
# Per-symbol house-margin overrides. AUDUSD=X: measured 2026-09-02 at 5.00%
# initial margin, well above fx_major's 3.32% class rate (EUR/GBP/JPY
# cluster around 3.3-3.7%) -- overridden per-symbol rather than dragging
# the whole class up to the one outlier.
overrides:
  "AUDUSD=X": {initial_margin_pct: 5.00, maintenance_margin_pct: 2.50}
short_borrow_annual_pct:
  default: 1.0                      # placeholder; real borrow fees are per-name
  overrides: {}
